<style>
    /* ... 이전 스타일 동일 ... */
    .search-results {
        position: absolute; width: 100%; max-height: 250px;
        overflow-y: auto; background: #fff; border: 1px solid var(--toss-border);
        border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        z-index: 9999; margin-top: 5px; display: none;
    }
    .search-item {
        padding: 14px 16px; border-bottom: 1px solid #f2f4f6;
        cursor: pointer; display: flex; flex-direction: column;
    }
    .search-item:hover { background: #f9fafb; }
    .search-row-1 { display: flex; justify-content: space-between; align-items: center; }
    .search-name { font-weight: 600; font-size: 15px; color: var(--toss-text-main); }
    .search-symbol { color: var(--toss-blue); font-weight: 700; font-size: 13px; }
    .search-exch { font-size: 11px; color: #999; margin-top: 2px; }
</style>

<div id="tickerModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">종목 추가</h3>
        <p id="targetSectorHint" style="font-size: 13px; color: var(--toss-blue); margin-bottom:15px;"></p>
        
        <div style="position: relative;">
            <input type="text" id="tickerSearchInput" class="input-field" 
                   placeholder="이름 입력 (예: 삼성전자, 테슬라, 엔비디아)" 
                   autocomplete="off">
            <div id="searchResults" class="search-results"></div>
        </div>

        <button onclick="closeModal('tickerModal')" style="width:100%; border:none; background:none; margin-top:15px; color:var(--toss-text-sub);">취소</button>
    </div>
</div>

<script>
    // [보완] 주요 종목 사전 데이터 (API 장애 대비 및 한글 검색 지원용)
    const masterStocks = [
        {n: "삼성전자", s: "005930", e: "KRX"}, {n: "SK하이닉스", s: "000660", e: "KRX"},
        {n: "현대차", s: "005380", e: "KRX"}, {n: "NAVER", s: "035420", e: "KRX"},
        {n: "카카오", s: "035720", e: "KRX"}, {n: "애플", s: "AAPL", e: "NASDAQ"},
        {n: "테슬라", s: "TSLA", e: "NASDAQ"}, {n: "엔비디아", s: "NVDA", e: "NASDAQ"},
        {n: "마이크로소프트", s: "MSFT", e: "NASDAQ"}, {n: "구글", s: "GOOGL", e: "NASDAQ"},
        {n: "아마존", s: "AMZN", e: "NASDAQ"}, {n: "메타", s: "META", e: "NASDAQ"},
        {n: "넷플릭스", s: "NFLX", e: "NASDAQ"}
    ];

    // 입력 감지 이벤트 리스너 (기존 oninput 방식보다 안정적)
    document.getElementById('tickerSearchInput').addEventListener('input', function(e) {
        const query = e.target.value.trim().toLowerCase();
        const resultsContainer = document.getElementById('searchResults');

        if (query.length < 1) {
            resultsContainer.style.display = 'none';
            return;
        }

        // 1. 내부 DB에서 먼저 검색 (한글 매칭 포함)
        let filtered = masterStocks.filter(item => 
            item.n.toLowerCase().includes(query) || item.s.toLowerCase().includes(query)
        );

        // 2. 외부 API 검색 (TradingView 보조 - JSONP 방식으로 CORS 우회 시도)
        fetchSymbolsFromExternal(query, filtered);
    });

    async function fetchSymbolsFromExternal(query, localResults) {
        const resultsContainer = document.getElementById('searchResults');
        
        // 일단 로컬 검색 결과라도 먼저 보여줌
        renderResults(localResults);

        try {
            // CORS 우회를 위해 대중적인 스탁 검색 API 활용 (알파밴티지나 트레이딩뷰 공개 호출)
            const response = await fetch(`https://symbol-search.tradingview.com/symbol_search/?text=${query}&type=stock`);
            const remoteData = await response.json();
            
            const remoteResults = remoteData.map(item => ({
                n: item.description,
                s: item.symbol,
                e: item.exchange
            }));

            // 로컬 결과와 합치되 중복 제거
            const combined = [...localResults];
            remoteResults.forEach(r => {
                if(!combined.some(l => l.s === r.s)) combined.push(r);
            });

            renderResults(combined);
        } catch (err) {
            console.log("외부 API 호출 제한, 로컬 데이터만 표시합니다.");
        }
    }

    function renderResults(list) {
        const container = document.getElementById('searchResults');
        if (list.length === 0) {
            container.innerHTML = '<div style="padding:15px; color:#999; font-size:13px;">검색 결과가 없습니다.</div>';
        } else {
            container.innerHTML = '';
            list.slice(0, 15).forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerHTML = `
                    <div class="search-row-1">
                        <span class="search-name">${item.n}</span>
                        <span class="search-symbol">${item.s}</span>
                    </div>
                    <span class="search-exch">${item.e}</span>
                `;
                div.onclick = () => {
                    addSymbolToSector(item.s, item.n);
                };
                container.appendChild(div);
            });
        }
        container.style.display = 'block';
    }

    function addSymbolToSector(symbol, name) {
        if (!data[currentSector].includes(symbol)) {
            data[currentSector].push(symbol);
            saveData();
            renderContent();
            closeModal('tickerModal');
            document.getElementById('tickerSearchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';
        } else {
            alert('이미 추가된 종목입니다.');
        }
    }

    // [중요] 기존 모달 닫기 시 검색창 초기화 로직 보완
    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('tickerSearchInput').value = '';
    }
</script>
